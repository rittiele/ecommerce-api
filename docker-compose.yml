services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_api
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ecommerce_api?schema=public
      JWT_SECRET: change-me-in-production
      PORT: 3333
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
